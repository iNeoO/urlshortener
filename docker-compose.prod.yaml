services:
  postgres:
    container_name: urlshortener-postgres-prod
    extends:
      file: docker-compose.yaml
      service: postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_URLSHORTENER_USER} -d ${PG_URLSHORTENER_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - urlshortener-postgres-network-prod

  db:
    container_name: urlshortener-db-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./db/dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urlshortener-postgres-network-prod

  frontend:
    container_name: urlshortener-frontend-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./apps/frontend/dockerfile
      args:
        PG_URL: ${PG_URL}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_REDIRECTOR_URL: ${VITE_REDIRECTOR_URL}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      db:
        condition: service_completed_successfully
    networks:
      - urlshortener-postgres-network-prod

  backend:
    container_name: urlshortener-backend-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./apps/backend/dockerfile
      args:
        PG_URL: ${PG_URL}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      db:
        condition: service_completed_successfully
    networks:
      - urlshortener-postgres-network-prod
      - redis-network
      - rabbitmq-network
      - monitoring-shared

  redirector:
    container_name: urlshortener-redirector-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./apps/redirector/dockerfile
      args:
        PG_URL: ${PG_URL}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      db:
        condition: service_completed_successfully
    networks:
      - urlshortener-postgres-network-prod
      - redis-network
      - rabbitmq-network
      - monitoring-shared

  notification-mail-worker:
    container_name: urlshortener-notification-mail-worker-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./workers/notifications-mail-worker/dockerfile
      args:
        PG_URL: ${PG_URL}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      db:
        condition: service_completed_successfully
    networks:
      - urlshortener-postgres-network-prod
      - rabbitmq-network

  stats-events-worker:
    container_name: urlshortener-stats-events-worker-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./workers/stats-events-worker/dockerfile
      args:
        PG_URL: ${PG_URL}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      db:
        condition: service_completed_successfully
    networks:
      - urlshortener-postgres-network-prod
      - redis-network
      - rabbitmq-network

  stats-aggregate-worker:
    container_name: urlshortener-stats-aggregate-worker-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./workers/stats-aggregate-worker/dockerfile
      args:
        PG_URL: ${PG_URL}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      db:
        condition: service_completed_successfully
    networks:
      - urlshortener-postgres-network-prod
      - redis-network
      - rabbitmq-network

  stats-aggregate-cron:
    container_name: urlshortener-stats-aggregate-cron-prod
    env_file:
      - ./.env.docker
    build:
      dockerfile: ./crons/stats-aggregate-cron/dockerfile
    depends_on:
      stats-aggregate-worker:
        condition: service_started
    networks:
      - rabbitmq-network

volumes:
  pgdata:

networks:
  urlshortener-postgres-network-prod:
    driver: bridge
  redis-network:
    name: ${REDIS_NETWORK:-redis-network}
    external: true
  rabbitmq-network:
    name: ${RABBITMQ_NETWORK:-rabbitmq-network}
    external: true
  monitoring-shared:
    name: ${MONITORING_SHARED_NETWORK:-monitoring-shared}
    external: true
